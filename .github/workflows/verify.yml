name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOFLAGS: -mod=vendor
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Formatting, build, vet, and unit tests
        run: make check

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOFLAGS: -mod=vendor
      GOTOOLCHAIN: local
      MEMOIR_TEST_DATABASE_URL: postgresql://memoir_test:memoir_test@127.0.0.1:5432/memoir_test?sslmode=disable
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: memoir_test
          POSTGRES_PASSWORD: memoir_test
          POSTGRES_DB: memoir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memoir_test -d memoir_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Migrate isolated database and run integration tests
        run: make test-integration
