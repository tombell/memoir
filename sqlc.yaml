version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/database/queries"
    schema: "internal/database/migrations"
    gen:
      go:
        emit_empty_slices: true
        emit_result_struct_pointers: true
        omit_unused_structs: true
        sql_package: "pgx/v5"
        package: "database"
        out: "internal/database"
        rename:
          bpm: "BPM"
          url: "URL"
        overrides:
          - db_type: "pg_catalog.numeric"
            go_type: "float64"
          - db_type: "pg_catalog.timestamp"
            go_type: "time.Time"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "uuid"
            go_type: "string"
          - db_type: "uuid"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - column: "tracks.fts_name_and_artist"
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              type: "TSVector"
